[build-system]
requires = ["hatchling>=1.21", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "neural-cost"
dynamic = ["version"]
description = "Theoretical and measured memory/compute analysis for neural networks."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Neural Cost contributors" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
torch = ["torch>=2.0"]
jax = ["jax>=0.4"]
# Apple Silicon JAX GPU plugins — install one of these to run JAX on MPS/Metal.
# jax-metal is the official Apple plugin; jax-mps is a community MLX-based backend.
# Without one of these, JAX silently falls back to CPU on Apple Silicon.
jax-metal = ["jax>=0.4", "jax-metal"]
jax-mps = ["jax>=0.4", "jax-mps"]
tensorflow = ["tensorflow>=2.12"]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.scripts]
neural-cost-compare = "neural_cost._cli:main"

[project.urls]
Homepage = "https://github.com/davidgraymi/neural-cost"

[tool.hatch.version]
source = "vcs"
tag-pattern = "v(?P<version>.*)"
fallback-version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["src/neural_cost"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[dependency-groups]
dev = [
    "matplotlib>=3.10.9",
    "seaborn>=0.13.2",
]
