name: CUDA Benchmark

# Triggered manually or when the `run-cuda-benchmark` label is applied to a PR.
# GPU runners are billed per-minute — do NOT run on every push.
on:
  workflow_dispatch:
    inputs:
      quick:
        description: 'Quick run (fewer batch sizes / repeats)'
        required: false
        default: 'false'
        type: choice
        options: ['true', 'false']
      peak_flops:
        description: 'Override peak FLOP/s (leave blank to auto-detect)'
        required: false
        default: ''
      memory_bandwidth:
        description: 'Override memory bandwidth in bytes/s (leave blank to auto-detect)'
        required: false
        default: ''
  pull_request:
    types: [labeled]

jobs:
  # Gate: only run on the label event if the right label was added.
  # workflow_dispatch always proceeds.
  check-label:
    runs-on: ubuntu-latest
    outputs:
      should-run: ${{ steps.gate.outputs.run }}
    steps:
      - id: gate
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event.label.name }}" == "run-cuda-benchmark" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  cuda-benchmark:
    needs: check-label
    if: needs.check-label.outputs.should-run == 'true'
    # -----------------------------------------------------------------------
    # GitHub-hosted GPU larger runner (NVIDIA Tesla T4, CUDA 12.x pre-installed)
    # Requires: Organization → Settings → Actions → Runners → Larger runners
    # with the "NVIDIA GPU-Optimized Image for AI and HPC" selected.
    # Label name must match your org's runner group label.
    # -----------------------------------------------------------------------
    runs-on: ubuntu-latest-gpu
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # Verify CUDA is available (fast sanity check before installing deps)
      # -----------------------------------------------------------------------
      - name: Verify CUDA / nvidia-smi
        run: |
          nvidia-smi
          nvcc --version

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      # -----------------------------------------------------------------------
      # Install PyTorch with CUDA 12.x, JAX with CUDA support.
      # TensorFlow is excluded: tf-nightly-gpu conflicts with stable JAX on
      # the T4 image; CPU-only TF is available via the base install if needed.
      # -----------------------------------------------------------------------
      - name: Install PyTorch (CUDA 12.x)
        run: |
          uv pip install torch torchvision --index-url https://download.pytorch.org/whl/cu124

      - name: Install JAX (CUDA 12.x)
        run: |
          uv pip install "jax[cuda12]" -f https://storage.googleapis.com/jax-releases/jax_cuda_releases.html

      - name: Install neural-cost and benchmark deps
        run: |
          uv pip install -e '.[dev]'
          uv pip install matplotlib seaborn

      # -----------------------------------------------------------------------
      # Optional: install TensorFlow GPU if available for this Python version
      # -----------------------------------------------------------------------
      - name: Install TensorFlow GPU (optional)
        run: uv pip install tensorflow[and-cuda] || echo "TF GPU install skipped"
        continue-on-error: true

      # -----------------------------------------------------------------------
      # Smoke-test: confirm JAX and PyTorch see the GPU
      # -----------------------------------------------------------------------
      - name: Smoke-test GPU visibility
        run: |
          python - <<'EOF'
          import torch, jax
          print("PyTorch CUDA available:", torch.cuda.is_available())
          if torch.cuda.is_available():
              print("  Device:", torch.cuda.get_device_name(0))
          print("JAX devices:", jax.devices())
          EOF

      # -----------------------------------------------------------------------
      # Run benchmark
      # -----------------------------------------------------------------------
      - name: Run CUDA benchmark
        run: |
          EXTRA_ARGS=""
          if [[ "${{ github.event.inputs.quick }}" == "true" ]]; then
            EXTRA_ARGS="--quick"
          fi
          if [[ -n "${{ github.event.inputs.peak_flops }}" ]]; then
            EXTRA_ARGS="$EXTRA_ARGS --peak-flops ${{ github.event.inputs.peak_flops }}"
          fi
          if [[ -n "${{ github.event.inputs.memory_bandwidth }}" ]]; then
            EXTRA_ARGS="$EXTRA_ARGS --memory-bandwidth ${{ github.event.inputs.memory_bandwidth }}"
          fi
          python benchmarks/collect_gpu_data.py --device cuda $EXTRA_ARGS

      # -----------------------------------------------------------------------
      # Generate the markdown report and figures
      # -----------------------------------------------------------------------
      - name: Generate GPU report
        run: python benchmarks/generate_gpu_report.py

      # -----------------------------------------------------------------------
      # Upload raw telemetry + report as artifacts (90-day retention)
      # -----------------------------------------------------------------------
      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cuda-benchmark-${{ github.sha }}
          retention-days: 90
          path: |
            benchmarks/results/benchmark_gpu_data.json
            GPU_BENCHMARK_REPORT.md
            benchmarks/results/figures/

      # -----------------------------------------------------------------------
      # Print a summary table to the Actions job summary page
      # -----------------------------------------------------------------------
      - name: Write job summary
        if: always()
        run: |
          echo "## CUDA Benchmark Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          python - >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          import json, pathlib, math

          data = json.loads(pathlib.Path("benchmarks/results/benchmark_gpu_data.json").read_text())
          hw = data["hardware"]
          records = data["records"]

          print(f"**Device:** {hw['name']}  ")
          print(f"**Peak FP32:** {hw['peak_flops']/1e12:.2f} TFLOP/s  ")
          print(f"**Peak BW:** {hw['memory_bandwidth']/1e9:.0f} GB/s  ")
          print(f"**Ridge point:** {hw['ridge_point']:.1f} FLOP/byte  ")
          print()

          archs = ["FF DNN", "CNN", "RNN", "LSTM", "Transformer"]
          frameworks = ["PyTorch", "JAX", "TensorFlow"]
          best_variants = {"PyTorch": "compiled", "JAX": "jit", "TensorFlow": "tf.function+XLA"}
          fallback_variants = {"PyTorch": "baseline", "JAX": "baseline", "TensorFlow": "tf.function"}

          def best_lat(fw, arch, batch):
              for v in [best_variants.get(fw), fallback_variants.get(fw), "baseline"]:
                  if not v:
                      continue
                  hits = [r for r in records
                          if r["framework"] == fw and r["variant"] == v
                          and r["architecture"] == arch and r["batch"] == batch]
                  if hits:
                      return hits[0]["latency_median_ms"]
              return None

          batches = sorted({r["batch"] for r in records})
          ref_batch = batches[len(batches) // 2]

          print(f"### Best latency (ms) at batch={ref_batch}")
          print()
          header = "| Architecture | " + " | ".join(frameworks) + " |"
          sep    = "|---" * (len(frameworks) + 1) + "|"
          print(header)
          print(sep)
          for arch in archs:
              cells = [arch]
              for fw in frameworks:
                  ms = best_lat(fw, arch, ref_batch)
                  cells.append(f"{ms:.3f}" if ms is not None else "—")
              print("| " + " | ".join(cells) + " |")
          EOF
