name: CI

on:
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Check code formatting and linting
        run: uv run --extra dev python scripts/format.py --check

  test:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.11', '3.12', '3.14']
        exclude:
          - python-version: '3.14'
            os: ubuntu-latest
          - python-version: '3.14'
            os: macos-latest
        include:
          - os: ubuntu-latest
            python-version: '3.14'
            skip_tensorflow: 'true'
          - os: macos-latest
            python-version: '3.14'
            skip_tensorflow: 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies (with TensorFlow)
        if: matrix.skip_tensorflow != 'true'
        run: uv sync --extra dev --extra torch --extra jax --extra tensorflow

      - name: Install dependencies (without TensorFlow)
        if: matrix.skip_tensorflow == 'true'
        run: uv sync --extra dev --extra torch --extra jax

      - name: Run tests
        run: uv run --extra dev python -m pytest tests/ -v
