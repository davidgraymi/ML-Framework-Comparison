name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and development tools
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check .
      - name: Test core package
        run: python -m unittest tests.test_estimate tests.test_profiler -v

  framework-e2e:
    name: ${{ matrix.framework }} adapter E2E
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - framework: PyTorch
            extra: torch
            test: tests.test_adapters_e2e.TorchAdapterE2ETest
          - framework: JAX
            extra: jax
            test: tests.test_adapters_e2e.JaxAdapterE2ETest
          - framework: TensorFlow
            extra: tensorflow
            test: tests.test_adapters_e2e.TensorFlowAdapterE2ETest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and ${{ matrix.framework }}
        run: python -m pip install -e ".[dev,${{ matrix.extra }}]"
      - name: Run ${{ matrix.framework }} end-to-end test
        run: python -m unittest ${{ matrix.test }} -v
