name: Publish

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "pyproject.toml"
    tags:
      - "v[0-9]+.[0-9]+.[0-9]*"
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Check code formatting and linting
        run: uv run --extra dev python scripts/format.py --check

  test:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.11', '3.12', '3.14']
        exclude:
          - python-version: '3.14'
            os: ubuntu-latest
          - python-version: '3.14'
            os: macos-latest
        include:
          - os: ubuntu-latest
            python-version: '3.14'
            skip_tensorflow: 'true'
          - os: macos-latest
            python-version: '3.14'
            skip_tensorflow: 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies (with TensorFlow)
        if: matrix.skip_tensorflow != 'true'
        run: uv sync --extra dev --extra torch --extra jax --extra tensorflow

      - name: Install dependencies (without TensorFlow)
        if: matrix.skip_tensorflow == 'true'
        run: uv sync --extra dev --extra torch --extra jax

      - name: Run tests
        run: uv run --extra dev python -m pytest tests/ -v

  roll-version:
    needs: [lint, test]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      rolled: ${{ steps.semver.outputs.changed }}
      version: ${{ steps.semver.outputs.version }}
      tag: ${{ steps.semver.outputs.version_tag }}
      bump_type: ${{ steps.semver.outputs.version_type }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Determine Semantic Version
        id: semver
        uses: paulhatch/semantic-version@v5.4.0
        with:
          tag_prefix: "v"
          change_path: "src pyproject.toml"
          search_commit_body: true

      - name: Create Git Tag
        if: steps.semver.outputs.changed == 'true'
        run: |
          TAG="${{ steps.semver.outputs.version_tag }}"
          echo "Creating and pushing tag $TAG..."
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Create GitHub Release
        if: steps.semver.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.semver.outputs.version_tag }}" \
            --title "Release ${{ steps.semver.outputs.version_tag }}" \
            --generate-notes

  publish:
    needs: [lint, test, roll-version]
    if: |
      always() &&
      (needs.lint.result == 'success') &&
      (needs.test.result == 'success') &&
      (needs.roll-version.outputs.rolled == 'true' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/neural-cost
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure release tag is set locally
        run: |
          git fetch --tags --force
          TAG="${{ needs.roll-version.outputs.tag }}"
          if [ -n "$TAG" ]; then
            git tag -a "$TAG" -m "Release $TAG" --force || true
          fi

      - uses: astral-sh/setup-uv@v5

      - name: Build sdist and wheel
        run: uv build

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Upload artifacts to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.roll-version.outputs.tag }}"
          if [ -z "$TAG" ] && [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          if [ -n "$TAG" ]; then
            gh release upload "$TAG" dist/* --clobber || true
          fi
