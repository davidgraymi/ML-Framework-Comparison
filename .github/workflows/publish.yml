name: Publish

# Fires whenever a version tag (e.g. v0.2.0) is pushed to the repo.
# The tag IS the release signal — no manual workflow_dispatch needed.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]*"

# Required for PyPI Trusted Publisher (OIDC) — no API token needed.
permissions:
  contents: read
  id-token: write

jobs:
  # ── 1. Lint ─────────────────────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history so hatch-vcs can read tags
      - uses: astral-sh/setup-uv@v5
      - run: uv run --extra dev ruff check src/ tests/

  # ── 2. Test matrix ──────────────────────────────────────────────────────
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.10', '3.12', '3.14']
        exclude:
          - python-version: '3.14'
            os: ubuntu-latest
          - python-version: '3.14'
            os: macos-latest
        include:
          - os: ubuntu-latest
            python-version: '3.14'
            skip_tensorflow: 'true'
          - os: macos-latest
            python-version: '3.14'
            skip_tensorflow: 'true'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies (with TensorFlow)
        if: matrix.skip_tensorflow != 'true'
        run: uv sync --extra dev --extra torch --extra jax --extra tensorflow

      - name: Install dependencies (without TensorFlow)
        if: matrix.skip_tensorflow == 'true'
        run: uv sync --extra dev --extra torch --extra jax

      - name: Run tests
        run: uv run --extra dev python -m pytest tests/ -v

  # ── 3. Build & publish ──────────────────────────────────────────────────
  publish:
    needs: [lint, test]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/neural-cost

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # hatch-vcs needs the full tag history

      - uses: astral-sh/setup-uv@v5

      - name: Build sdist and wheel
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # No `with: password:` needed — PyPI Trusted Publisher authenticates
        # via the OIDC id-token permission granted above.
